name: Sync with Morphe Patches

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The script checks out other refs, so run a copy of it.
          cp sync.sh "$RUNNER_TEMP/sync.sh"
          bash "$RUNNER_TEMP/sync.sh" "${{ matrix.channel }}"
